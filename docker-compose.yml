version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: commercepilot_db
    restart: always
    environment:
      POSTGRES_DB: commercepilot
      POSTGRES_USER: commercepilot
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: commercepilot_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=commercepilot-docker-dev-secret-key-2026
      - DATABASE_URL=postgres://commercepilot:password123@db:5432/commercepilot
      - ALLOWED_HOSTS=*
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: commercepilot_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
